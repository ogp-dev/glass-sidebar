[project]
name = "glass"
version = "0.1.0"
description = "Glass Sidebar — real-time podcast fact-checker backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",
    "anthropic>=0.39.0",
    "deepgram-sdk>=3.7.0",
    "exa-py>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "httpx-ws>=0.9.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
# B008: FastAPI intentionally uses Depends() in function argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
